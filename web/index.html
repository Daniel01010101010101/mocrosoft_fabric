<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Fabric Radar: centro de inteligencia en español que monitorea, traduce y analiza automáticamente las novedades oficiales de Microsoft Fabric." />
    <meta name="theme-color" content="#0a0d0b" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>Fabric Radar · Novedades de Microsoft Fabric</title>
    <script>
      try {
        var t = localStorage.getItem('fr-theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
