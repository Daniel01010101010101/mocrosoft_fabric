name: Publicar en GitHub Pages

# Se publica siempre desde la rama de producción "main" (la autorizada en el entorno github-pages).
# La ingesta automática lanza este workflow al terminar cada ejecución.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fabric-radar-pages
  cancel-in-progress: false

jobs:
  build:
    name: Construir sitio
    if: ${{ github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el repositorio (última versión de los datos)
        uses: actions/checkout@v4
        with:
          # Nombre de rama (no SHA): así se incluye el commit de datos recién hecho por la ingesta.
          ref: main

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Generar API estática y compilar el frontend
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npm run build

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    name: Desplegar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
